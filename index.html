<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>جشنواره فروش - گروه برنز | بیمه کارآفرین</title>

<!-- فونت وزیرمتن از CDN -->
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">

<style>
/* ============================================================
   متغیرهای رنگی
   ============================================================ */
:root {
  --green-dark: #5a6b4d;
  --green-mid: #7a8a6c;
  --green-light: #9aab8c;
  --gold-main: #c9a961;
  --gold-light: #e0c586;
  --gold-dark: #a88840;
  --cream: #f7f3e8;
  --text-dark: #3a4a2e;
  --text-mid: #5a6b4d;
  --shadow-soft: 0 4px 20px rgba(90, 107, 77, 0.15);
  --shadow-strong: 0 15px 40px rgba(90, 107, 77, 0.25);
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  font-family: 'Vazirmatn', Tahoma, sans-serif;
  direction: rtl;
  text-align: right;
  background: #f0ede5;
  color: var(--text-dark);
  min-height: 100vh;
  overflow-x: hidden;
}

/* ============================================================
   مدیریت صفحه‌ها
   ============================================================ */
.screen {
  display: none;
  min-height: 100vh;
  width: 100%;
  position: relative;
}

.screen.active {
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

/* ============================================================
   صفحه پاکت نامه
   ============================================================ */
#envelope-screen {
  background: linear-gradient(135deg, #f0ede5 0%, #e8e4d8 100%);
}

.envelope-wrapper {
  position: relative;
  max-width: 700px;
  width: 100%;
  cursor: pointer;
  perspective: 1500px;
  transform-style: preserve-3d;
  animation: floatEnvelope 4s ease-in-out infinite;
}

@keyframes floatEnvelope {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-12px); }
}

.envelope-wrapper:hover {
  animation-play-state: paused;
}

.envelope-wrapper:active {
  transform: scale(0.98);
}

/* تصویر پاکت */
.envelope-image {
  width: 100%;
  height: auto;
  display: block;
  border-radius: 8px;
  box-shadow: var(--shadow-strong);
  transition: all 0.5s ease;
  user-select: none;
  -webkit-user-drag: none;
}

.envelope-wrapper:hover .envelope-image {
  box-shadow: 
    0 25px 60px rgba(90, 107, 77, 0.35),
    0 0 0 3px rgba(201, 169, 97, 0.3);
}

/* متن راهنما زیر پاکت */
.envelope-hint {
  position: absolute;
  bottom: -70px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(255, 255, 255, 0.95);
  color: var(--text-mid);
  padding: 12px 30px;
  border-radius: 30px;
  font-size: 15px;
  font-weight: 600;
  box-shadow: var(--shadow-soft);
  white-space: nowrap;
  animation: pulseHint 2.2s ease-in-out infinite;
  backdrop-filter: blur(10px);
}

@keyframes pulseHint {
  0%, 100% { 
    opacity: 0.85;
    transform: translateX(-50%) translateY(0);
  }
  50% { 
    opacity: 1;
    transform: translateX(-50%) translateY(-5px);
  }
}

/* انیمیشن باز شدن پاکت */
.envelope-wrapper.opening {
  animation: openAnimation 1.6s cubic-bezier(0.4, 0, 0.2, 1) forwards;
  pointer-events: none;
}

@keyframes openAnimation {
  0% {
    transform: scale(1) translateY(0) rotateX(0deg);
    opacity: 1;
  }
  30% {
    transform: scale(1.05) translateY(-20px) rotateX(-10deg);
    opacity: 1;
  }
  60% {
    transform: scale(1.15) translateY(-40px) rotateX(-25deg);
    opacity: 0.8;
  }
  100% {
    transform: scale(1.4) translateY(-80px) rotateX(-45deg);
    opacity: 0;
  }
}

.envelope-wrapper.opening .envelope-hint {
  opacity: 0;
  transition: opacity 0.3s;
}

/* ============================================================
   صفحه نتایج
   ============================================================ */
#winners-screen {
  background: #f0ede5;
  padding: 0;
  align-items: flex-start !important;
  overflow-y: auto;
}

.letter-container {
  position: relative;
  width: 100%;
  max-width: 800px;
  min-height: 100vh;
  margin: 20px auto;
  padding: 0;
}

/* تصویر کاغذ به عنوان پس‌زمینه با نسبت ابعاد */
.letter-paper {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  object-fit: fill;
  z-index: 0;
  pointer-events: none;
}

/* محتوای داخل کاغذ */
.letter-content {
  position: relative;
  z-index: 2;
  padding: 90px 70px 90px;
  min-height: 100vh;
}

/* سربرگ */
.letter-header {
  text-align: center;
  margin-bottom: 35px;
  padding: 0;
}

.letter-title {
  font-size: 38px;
  font-weight: 800;
  color: var(--green-dark);
  margin-bottom: 8px;
  letter-spacing: -0.5px;
}

.letter-subtitle {
  font-size: 16px;
  color: var(--text-mid);
  font-weight: 500;
  margin-bottom: 6px;
}

.letter-divider {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  margin: 20px auto;
  max-width: 250px;
}

.letter-divider::before,
.letter-divider::after {
  content: '';
  flex: 1;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--green-mid), transparent);
}

.letter-divider span {
  color: var(--gold-main);
  font-size: 14px;
  letter-spacing: 6px;
}

.letter-count {
  display: inline-block;
  background: rgba(255, 255, 255, 0.7);
  color: var(--green-dark);
  padding: 6px 20px;
  border-radius: 20px;
  font-size: 13px;
  font-weight: 600;
  border: 1px solid var(--green-light);
}

.letter-count strong {
  color: var(--gold-dark);
  font-size: 17px;
  margin: 0 4px;
}

/* جدول برندگان - بدون پس‌زمینه */
.winners-table-wrapper {
  position: relative;
  z-index: 2;
  background: transparent;  /* ← مهم: حذف پس‌زمینه سفید */
  border-radius: 0;
  box-shadow: none;
  overflow: visible;
  border: none;
}

.winners-table {
  width: 100%;
  border-collapse: collapse;
  table-layout: fixed;
}

.winners-table thead th {
  background: transparent;
  color: var(--green-dark);
  padding: 14px 12px;
  font-size: 14px;
  font-weight: 700;
  text-align: right;
  white-space: nowrap;
  border-bottom: 2px solid var(--green-mid);
}

.winners-table th.col-rank { width: 80px; text-align: center; }
.winners-table th.col-name { width: auto; }
.winners-table th.col-code { width: 110px; }
.winners-table th.col-branch { width: 180px; }

.winners-table tbody tr {
  background: transparent;
  transition: all 0.5s ease;
  opacity: 0;
  transform: translateY(15px);
}

.winners-table tbody tr.revealed {
  opacity: 1;
  transform: translateY(0);
}

.winners-table tbody tr:hover {
  background: rgba(201, 169, 97, 0.08);
}

.winners-table td {
  padding: 12px;
  font-size: 14px;
  color: var(--text-dark);
  border-bottom: 1px solid rgba(122, 138, 108, 0.2);
  vertical-align: middle;
  background: transparent;
}

.winners-table td.col-rank {
  text-align: center;
  color: var(--green-dark);
  font-weight: 700;
  font-size: 16px;
  font-variant-numeric: tabular-nums;
}

.winners-table td.col-name {
  font-weight: 600;
  color: var(--text-dark);
}

.winners-table td.col-code {
  color: var(--text-mid);
  font-variant-numeric: tabular-nums;
  letter-spacing: 0.5px;
}

.winners-table td.col-branch {
  color: var(--text-mid);
}

/* سه نفر اول - تمایز طلایی */
.winners-table tbody tr:nth-child(1),
.winners-table tbody tr:nth-child(2),
.winners-table tbody tr:nth-child(3) {
  background: rgba(201, 169, 97, 0.08);
}

.winners-table tbody tr:nth-child(1) td.col-rank,
.winners-table tbody tr:nth-child(2) td.col-rank,
.winners-table tbody tr:nth-child(3) td.col-rank {
  color: var(--gold-dark);
  font-size: 18px;
  text-shadow: 0 0 6px rgba(201, 169, 97, 0.4);
}

/* حذف مهر شناور (چون در تصویر خودت مهر هست) */
.letter-seal {
  display: none;
}

/* دکمه بازگشت */
.back-btn {
  position: fixed;
  top: 20px;
  right: 20px;
  z-index: 100;
  background: rgba(255, 255, 255, 0.95);
  color: var(--green-dark);
  border: 2px solid var(--green-dark);
  padding: 10px 22px;
  border-radius: 30px;
  font-family: inherit;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  box-shadow: var(--shadow-soft);
  transition: all 0.3s;
  backdrop-filter: blur(10px);
}

.back-btn:hover {
  background: var(--green-dark);
  color: var(--cream);
  transform: translateY(-2px);
  box-shadow: var(--shadow-strong);
}

/* لوگو */
.company-logo {
  position: fixed;
  top: 20px;
  left: 20px;
  z-index: 100;
  background: rgba(255, 255, 255, 0.95);
  padding: 8px 16px;
  border-radius: 12px;
  box-shadow: var(--shadow-soft);
  border: 1px solid rgba(201, 169, 97, 0.3);
  backdrop-filter: blur(10px);
}

.company-logo img {
  height: 40px;
  display: block;
  object-fit: contain;
}

/* ============================================================
   موبایل
   ============================================================ */
@media (max-width: 640px) {
  .envelope-hint {
    bottom: -55px;
    padding: 10px 20px;
    font-size: 13px;
  }

  .company-logo {
    top: 12px;
    left: 12px;
    padding: 6px 10px;
  }

  .company-logo img {
    height: 28px;
  }

  .back-btn {
    top: 12px;
    right: 12px;
    padding: 8px 16px;
    font-size: 12px;
  }

  .letter-container {
    padding: 70px 12px 60px;
  }

  .letter-title {
    font-size: 26px;
  }

  .letter-subtitle {
    font-size: 14px;
  }

  .letter-count {
    font-size: 13px;
    padding: 6px 16px;
  }

  .letter-count strong {
    font-size: 16px;
  }

  .letter-seal {
    width: 50px;
    height: 50px;
    font-size: 22px;
    bottom: 12px;
    left: 12px;
  }

  .winners-table th.col-rank { width: 50px; }
  .winners-table th.col-code { width: 75px; }
  .winners-table th.col-branch { width: 110px; }

  .winners-table thead th {
    padding: 12px 6px;
    font-size: 11px;
  }

  .winners-table td {
    padding: 10px 6px;
    font-size: 12px;
  }

  .winners-table td.col-rank {
    font-size: 13px;
  }

  .winners-table tbody tr:nth-child(1) td.col-rank,
  .winners-table tbody tr:nth-child(2) td.col-rank,
  .winners-table tbody tr:nth-child(3) td.col-rank {
    font-size: 15px;
  }
}
</style>
</head>
<body>

<!-- لوگو -->
<div class="company-logo">
  <img src="assets/logo.png" alt="بیمه کارآفرین">
</div>

<!-- ============================================================
     صفحه پاکت نامه
     ============================================================ -->
<div id="envelope-screen" class="screen active">
  <div class="envelope-wrapper" id="envelopeWrapper" onclick="openEnvelope()">
    <img src="assets/envelope.png" alt="پاکت نامه جشنواره" class="envelope-image">
    <div class="envelope-hint">👆 برای مشاهده برندگان کلیک کنید</div>
  </div>
</div>

<<!-- ============================================================
     صفحه نتایج
     ============================================================ -->
<div id="winners-screen" class="screen">

  <button class="back-btn" onclick="goBack()">← بازگشت</button>

  <div class="letter-container">
    
    <!-- تصویر کاغذ به عنوان پس‌زمینه -->
    <img src="assets/letter.png" alt="" class="letter-paper">
    
    <!-- محتوا روی کاغذ -->
    <div class="letter-content">
      
      <header class="letter-header">
        <h1 class="letter-title">گروه برنز</h1>
        <p class="letter-subtitle">جشنواره فروش بیمه‌های زندگی</p>
        <div class="letter-divider"><span>✦ ✦ ✦</span></div>
        <div class="letter-count">
          تعداد برندگان: <strong id="total-count">۰</strong> نفر
        </div>
      </header>

      <div class="winners-table-wrapper">
        <table class="winners-table">
          <thead>
            <tr>
              <th class="col-rank">رتبه</th>
              <th class="col-name">نام برنده</th>
              <th class="col-code">کد</th>
              <th class="col-branch">شعبه سرپرستی</th>
            </tr>
          </thead>
          <tbody id="winners-tbody"></tbody>
        </table>
      </div>
      
    </div>
  </div>

</div>

<script>
/* ============================================================
   داده‌های برندگان
   ============================================================ */
const WINNERS_DATA = [
  {"rank": 31, "name": "الهه شاه محمدی", "code": "1159", "branch": "کرج"},
  {"rank": 32, "name": "کتایون حاجبی", "code": "9667", "branch": "تهران مرکز"},
  {"rank": 33, "name": "رحیم حاجیان زیدی", "code": "7810", "branch": "رشت"},
  {"rank": 34, "name": "سارا اسدی پور", "code": "9608", "branch": "کرمان"},
  {"rank": 35, "name": "وحید یوسفی", "code": "9650", "branch": "تبریز"},
  {"rank": 36, "name": "خورشید آرامش یاریگر فردا", "code": "7775", "branch": "مشهد"},
  {"rank": 37, "name": "معصومه عنایتی پور", "code": "6307", "branch": "مشهد"},
  {"rank": 38, "name": "غلامرضا ایاغ", "code": "8100", "branch": "تهران مرکز"},
  {"rank": 39, "name": "طاهره کاشفی", "code": "9334", "branch": "سمنان"},
  {"rank": 40, "name": "محدثه قسامیان", "code": "9671", "branch": "شعبه شهرراز"},
  {"rank": 41, "name": "سپیده خوردسال", "code": "6567", "branch": "مشهد"},
  {"rank": 42, "name": "زهرا قناعتیان", "code": "1308", "branch": "شیراز"},
  {"rank": 43, "name": "مرجان جمالی", "code": "9614", "branch": "یزد"},
  {"rank": 44, "name": "عاطفه ارادتی", "code": "1028", "branch": "تهران مرکز"},
  {"rank": 45, "name": "زینب محمدی", "code": "4584", "branch": "بوشهر"},
  {"rank": 46, "name": "عذرا جعفری", "code": "3942", "branch": "خوی"},
  {"rank": 47, "name": "محمد علاوی طوسی", "code": "7776", "branch": "مشهد"},
  {"rank": 48, "name": "هانیه رئیسی", "code": "9647", "branch": "شیراز"},
  {"rank": 49, "name": "الهام قورچیانی", "code": "4918", "branch": "نجف آباد"},
  {"rank": 50, "name": "هنگامه اسفندیاری", "code": "7261", "branch": "شعبه شهرراز"},
  {"rank": 51, "name": "محسن نظر زاده خانمیر", "code": "9604", "branch": "تبریز"},
  {"rank": 52, "name": "شرکت تدبیر آرامش زندگی", "code": "7803", "branch": "سنندج"},
  {"rank": 53, "name": "آزاده خرمی", "code": "9612", "branch": "اراک"},
  {"rank": 54, "name": "زهرا جعفری نیا", "code": "3588", "branch": "اراک"},
  {"rank": 55, "name": "منصور گله بان", "code": "9679", "branch": "ارومیه"},
  {"rank": 56, "name": "سعیده رضوان یار", "code": "9540", "branch": "سیرجان"},
  {"rank": 57, "name": "نسرین باقریان فر", "code": "9666", "branch": "مشهد"},
  {"rank": 58, "name": "الهه آشوری", "code": "7570", "branch": "سمنان"},
  {"rank": 59, "name": "سمیه قاسمی زرینی", "code": "7659", "branch": "ساری"},
  {"rank": 60, "name": "زهرا طالبی زاده", "code": "9598", "branch": "کرمان"},
  {"rank": 61, "name": "شرکت ضربان زندگی", "code": "7862", "branch": "مشهد"},
  {"rank": 62, "name": "روح اله زارعی", "code": "3032", "branch": "خرم آباد"},
  {"rank": 63, "name": "مهسا مقصودلو", "code": "6331", "branch": "گرگان"},
  {"rank": 64, "name": "محمدرضا طلیعه بخش", "code": "7947", "branch": "رشت"},
  {"rank": 65, "name": "مریم ملا احمدی", "code": "1446", "branch": "اصفهان"},
  {"rank": 66, "name": "زهرا ذوالفقاری نسب", "code": "6573", "branch": "کرمان"},
  {"rank": 67, "name": "مجید یداللهی", "code": "4224", "branch": "سمنان"}
];

/* ============================================================
   توابع کمکی
   ============================================================ */
function toFa(num) {
  const digits = ['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];
  return String(num).replace(/\d/g, d => digits[d]);
}

function fixPersian(text) {
  if (!text) return "";
  return String(text).replace(/ي/g, "ی").replace(/ك/g, "ک").replace(/ة/g, "ه");
}

/* ============================================================
   باز کردن پاکت و انتقال به صفحه نتایج
   ============================================================ */
function openEnvelope() {
  const wrapper = document.getElementById("envelopeWrapper");
  if (wrapper.classList.contains("opening")) return;
  
  // شروع انیمیشن
  wrapper.classList.add("opening");
  
  // بعد از انیمیشن، صفحه رو عوض کن
  setTimeout(() => {
    document.getElementById("envelope-screen").classList.remove("active");
    document.getElementById("winners-screen").classList.add("active");
    loadWinners();
  }, 1400);
}

/* ============================================================
   بارگذاری برندگان
   ============================================================ */
function loadWinners() {
  const tbody = document.getElementById("winners-tbody");
  
  try {
    const winners = [...WINNERS_DATA];
    winners.sort((a, b) => a.rank - b.rank);
    
    document.getElementById("total-count").textContent = toFa(winners.length);
    
    tbody.innerHTML = "";
    
    winners.forEach((winner, i) => {
      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td class="col-rank">${toFa(winner.rank)}</td>
        <td class="col-name">${fixPersian(winner.name)}</td>
        <td class="col-code">${toFa(winner.code)}</td>
        <td class="col-branch">${fixPersian(winner.branch)}</td>
      `;
      tbody.appendChild(tr);
      
      // انیمیشن تدریجی برای هر ردیف
      setTimeout(() => {
        tr.classList.add("revealed");
      }, 100 + i * 40);
    });
  } catch (err) {
    console.error("خطا:", err);
    tbody.innerHTML = `<tr><td colspan="4" style="text-align:center;padding:30px;">خطا در بارگذاری داده‌ها</td></tr>`;
  }
}

/* ============================================================
   بازگشت به پاکت
   ============================================================ */
function goBack() {
  document.getElementById("winners-screen").classList.remove("active");
  document.getElementById("envelope-screen").classList.add("active");
  
  const wrapper = document.getElementById("envelopeWrapper");
  wrapper.classList.remove("opening");
  
  document.getElementById("winners-tbody").innerHTML = "";
}

/* ============================================================
   کلیدهای میانبر
   ============================================================ */
document.addEventListener("keydown", (e) => {
  if (document.getElementById("winners-screen").classList.contains("active")) {
    if (e.key === "Escape") goBack();
  } else if (document.getElementById("envelope-screen").classList.contains("active")) {
    if (e.key === " " || e.key === "Enter") {
      e.preventDefault();
      openEnvelope();
    }
  }
});
</script>
</body>
</html>
